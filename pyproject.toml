[project]
name = "debate-arena"
version = "1.00"
description = "Autonomous multi-agent AI debate system (HW2 — Exercise 02)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TODO: Name", email = "mohammad@mryosef.com" }]
dependencies = [
    "google-genai>=0.3.0",
    "tavily-python>=0.5.0",
    "ddgs>=9.0.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
debate-arena = "debate_arena.cli.menu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate_arena"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
# Omit integration-only glue exercised by the live run / smoke test, not unit tests:
# the CLI, the process transport, and the network search providers.
omit = [
    "src/main.py",
    "*/tests/*",
    "src/**/cli/*",
    "*/process_handle.py",
    "*/search_providers.py",
]

[tool.coverage.report]
fail_under = 85

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
